name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup D (LDC)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Build
        run: dub build --compiler=ldc2 -c release --build=release

      - name: Install Inno Setup
        run: choco install innosetup -y; $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        shell: pwsh

      - name: Build installer
        run: iscc installer/setup.iss
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            RefreshThumbcache.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
