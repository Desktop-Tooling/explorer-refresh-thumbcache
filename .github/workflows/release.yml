name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish src/RefreshThumbcache/RefreshThumbcache.csproj -c Release -o src/RefreshThumbcache/bin/Release/net8.0/win-x64/publish

      - name: Install Inno Setup
        run: choco install innosetup -y; $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        shell: pwsh

      - name: Build installer
        run: iscc installer/setup.iss
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            src/RefreshThumbcache/bin/Release/net8.0/win-x64/publish/RefreshThumbcache.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
