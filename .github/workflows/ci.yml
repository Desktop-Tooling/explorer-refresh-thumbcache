name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup D (LDC)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Build (release, nogc)
        run: dub build --compiler=ldc2 -c release --build=release

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RefreshThumbcache-exe
          path: RefreshThumbcache.exe

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup D (LDC)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Build
        run: dub build --compiler=ldc2 -c release --build=release

      - name: Install Inno Setup
        run: choco install innosetup -y; $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        shell: pwsh

      - name: Build installer
        run: iscc installer/setup.iss
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RefreshThumbcache-Setup
          path: dist/*.exe
