name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish src/RefreshThumbcache/RefreshThumbcache.csproj -c Release -o src/RefreshThumbcache/bin/Release/net8.0/win-x64/publish --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: RefreshThumbcache-publish
          path: src/RefreshThumbcache/bin/Release/net8.0/win-x64/publish/

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and Publish
        run: dotnet publish src/RefreshThumbcache/RefreshThumbcache.csproj -c Release -o src/RefreshThumbcache/bin/Release/net8.0/win-x64/publish

      - name: Install Inno Setup
        run: choco install innosetup -y; $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        shell: pwsh

      - name: Build installer
        run: iscc installer/setup.iss
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RefreshThumbcache-Setup
          path: dist/*.exe
